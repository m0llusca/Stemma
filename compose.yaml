# Local development Postgres only — do not reuse for production.
# Port is bound to localhost so the DB is not reachable from other hosts.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: qc_app
      POSTGRES_USER: qc_app
      POSTGRES_PASSWORD: qc_app
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - qc_app_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qc_app -d qc_app"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  qc_app_postgres_data:
